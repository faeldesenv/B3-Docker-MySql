services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=calculadoracdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cdb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculadoracdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  calculadoracdb.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=calculadoracdb;Username=postgres;Password=postgres
    image: ${DOCKER_REGISTRY-}calculadoracdbapi
    build:
      context: .
      dockerfile: CalculadoraCdb.Api/Dockerfile
    ports:
      - "5000:8080"
    networks:
      - cdb-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=http://localhost:5000
    container_name: frontend
    ports:
      - "8081:80"
    networks:
      - cdb-network
    depends_on:
      calculadoracdb.api:
        condition: service_healthy

networks:
  cdb-network:
    driver: bridge

volumes:
  postgres_data:
